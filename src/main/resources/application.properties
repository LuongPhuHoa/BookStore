spring.application.name=bookstore

spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.threads.virtual.enabled=true

server.error.include-message=never
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Replace in production, for example with the JWT_SECRET environment variable.
# The value must be a Base64-encoded secret of at least 256 bits for HS256.
security.jwt.secret=${JWT_SECRET:bXktdmVyeS1sb25nLWRlbW8tc2VjcmV0LWtleS1mb3Itand0LTI1Ng==}
security.jwt.expiration=PT1H
