# ═════════════════════════════════════════════════════════════════════════════
# HIBERNATE LEARNING LABORATORY - APPLICATION CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════
# This is a Spring Boot 3.5.x application configured for educational purposes.
# Every property is annotated to explain its purpose and impact on Hibernate.
#
# HOW TO READ THIS FILE:
# Each property section includes:
# 1. What it does
# 2. Why we set it to this value for learning
# 3. What happens if you change it
# 4. Alternative values and their effects
# ═════════════════════════════════════════════════════════════════════════════


# ═════════════════════════════════════════════════════════════════════════════
# APPLICATION IDENTIFICATION
# ═════════════════════════════════════════════════════════════════════════════

# Application name (appears in logs, metrics, monitoring)
# Used by Spring, Actuator, and external monitoring tools
# No impact on functionality, purely for identification
spring.application.name=bookstore


# ═════════════════════════════════════════════════════════════════════════════
# DATABASE CONNECTION CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════

# PostgreSQL Connection URL
# Format: jdbc:postgresql://HOST:PORT/DATABASE
# - localhost: PostgreSQL server on same machine
# - 5432: Default PostgreSQL port
# - bookstore: Database name (must exist, created manually with: CREATE DATABASE bookstore;)
#
# WHAT HAPPENS if wrong:
# - If host/port wrong: "Connection refused" error at startup
# - If database doesn't exist: "FATAL: database 'bookstore' does not exist"
# - If password wrong: "FATAL: password authentication failed"
spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore

# JDBC Driver Class Name
# Tells Spring which driver to use for PostgreSQL
# Spring auto-detects if in classpath (pom.xml dependency)
# This property is OPTIONAL (Spring finds it automatically)
# But explicitly setting it improves clarity
#
# Alternative drivers:
# - org.h2.Driver (for H2 in-memory database)
# - com.mysql.cj.jdbc.Driver (for MySQL)
# - oracle.jdbc.driver.OracleDriver (for Oracle)
spring.datasource.driver-class-name=org.postgresql.Driver

# Database credentials
# - Username: "postgres" (default PostgreSQL superuser)
# - Password: "postgres" (set during PostgreSQL installation)
#
# SECURITY WARNING:
# ⚠️  NEVER put passwords in source code in production!
# Use instead:
# - Environment variables: spring.datasource.password=${DB_PASSWORD}
# - Secrets manager (AWS Secrets Manager, HashiCorp Vault)
# - Spring Cloud Config with encrypted properties
#
# For this learning lab, hardcoded credentials are OK (development only)
spring.datasource.username=postgres
spring.datasource.password=postgres


# ═════════════════════════════════════════════════════════════════════════════
# HIBERNATE & JPA CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════

# DDL (Data Definition Language) Strategy
# Controls how Hibernate handles database schema
#
# OPTIONS:
# - validate    : Check schema matches entity definitions (don't modify DB)
#                 USAGE: Production (verify existing schema)
#                 ISSUE: Fails if schema doesn't match
#
# - update      : Create/modify tables as needed
#                 USAGE: Development/staging with persistent data
#                 CAUTION: Can lose data with certain changes
#
# - create      : DROP all tables, then CREATE fresh
#                 USAGE: Development/testing (reset DB each startup)
#                 RISK: LOSES ALL DATA on restart
#                 LEARNING: Perfect for this lab (reproducible state)
#
# - create-drop : CREATE tables on startup, DROP on shutdown
#                 USAGE: Testing (isolation)
#                 BENEFIT: Automatic cleanup after tests
#
# - none        : Don't touch schema (manual management)
#                 USAGE: Legacy systems, complex migrations
#
# WE USE 'create' BECAUSE:
# - This is a learning laboratory
# - Fresh schema on each startup (reproducible)
# - Easy to experiment without cleanup
# - Can reset to known state anytime
#
# ⚠️  PRODUCTION MUST NEVER USE THIS!
# Production should use: validate or custom migration tools (Flyway, Liquibase)
spring.jpa.hibernate.ddl-auto=create

# Open EntityManager in View (Anti-pattern)
# FALSE (recommended): Session closes at service layer
# TRUE (bad): Lazy loading works even outside transaction
#
# EXPLANATION:
# Without this setting:
# - Session closes when @Transactional ends
# - Accessing lazy-loaded relationships outside transaction → LazyInitializationException
# - This is CORRECT behavior (teaches proper design)
#
# With spring.jpa.open-in-view=true (anti-pattern):
# - Session stays open for entire HTTP request
# - Lazy loading works "magically" in controller/view
# - Hides N+1 query problems
# - Bad for performance (session held too long)
#
# WE DISABLE (false) because:
# - Learn proper transaction boundaries
# - Understand when lazy loading fails
# - Practice eager loading strategies
# - Better application design
#
# See Commit 05-08 for relationship loading strategies
spring.jpa.open-in-view=false

# Show SQL in console logs
# true: Logs generated SQL statements (VERY NOISY)
# false: Don't log SQL (rely on logging.level.org.hibernate.SQL=DEBUG)
#
# We set true for visibility, but combined with logging levels below
# This setting can be overridden by logging configuration
#
# IMPORTANT: Use logging.level.org.hibernate.SQL=DEBUG for actual control
# (Don't rely on this property alone)
spring.jpa.show-sql=true

# Format SQL output
# Adds newlines and indentation to generated SQL
# Makes console logs readable (otherwise SQL is one long line)
#
# FORMATTED (with this true):
# select
#     b.id,
#     b.isbn,
#     b.price,
#     b.title
# from
#     books b
# where
#     b.id=?
#
# UNFORMATTED (if false):
# select b.id, b.isbn, b.price, b.title from books b where b.id=?
spring.jpa.properties.hibernate.format_sql=true

# Add SQL comments from generated SQL
# Shows which entity/field generated which SQL
# Helps debugging: links SQL to source code
#
# EXAMPLE:
# /* select generated by org.example.bookstore.entity.Book */ select ...
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate Dialect
# Tells Hibernate which SQL dialect to use
# Different databases have different SQL syntax/functions
#
# Common dialects:
# - org.hibernate.dialect.PostgreSQLDialect (for PostgreSQL)
# - org.hibernate.dialect.MySQL8Dialect (for MySQL 8)
# - org.hibernate.dialect.H2Dialect (for H2 database)
# - org.hibernate.dialect.Oracle21cDialect (for Oracle)
#
# Each dialect knows:
# - Data type mappings (Java BigDecimal → PostgreSQL NUMERIC)
# - SQL function names (LENGTH, SUBSTRING, etc.)
# - DDL syntax (CREATE TABLE differences)
# - Sequence/identity strategies
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ═════════════════════════════════════════════════════════════════════════════
# JAVA 21 VIRTUAL THREADS (Project Loom)
# ═════════════════════════════════════════════════════════════════════════════

# Enable virtual threads
# TRUE: Spring Boot 3.5+ uses virtual threads for request handling
# FALSE: Traditional OS threads (default before Java 21)
#
# Virtual threads:
# - Lightweight (millions can run simultaneously)
# - Better for I/O-bound operations
# - Simpler concurrency model
# - Main feature of Project Loom
#
# BENEFITS:
# - Higher throughput (database I/O bound apps)
# - Better CPU utilization
# - Simpler async code (no need for reactive frameworks)
#
# OBSERVATION:
# In logs, you'll see:
# thread=VirtualThread[#123]/runnable@ForkJoinPool-1-worker-1
# (Instead of: thread=http-nio-8080-exec-1)
spring.threads.virtual.enabled=true


# ═════════════════════════════════════════════════════════════════════════════
# ERROR RESPONSE CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════

# Include error message in HTTP error responses
# OPTIONS:
# - always  : Always include error message in response body
# - on_param: Include only if ?includeMessage=true query param present
# - never   : Never include error message (secure)
#
# SECURITY CONSIDERATION:
# - never: Prevents leaking internal error details to attackers
# - always: Helpful for debugging but leaks information
#
# WE USE 'never' because:
# - Security best practice
# - Errors logged server-side (developers can debug)
# - Clients get generic message (no stack trace leakage)
#
# Spring Boot basic error handling returns the default error body.
server.error.include-message=never


# ═════════════════════════════════════════════════════════════════════════════
# LOGGING CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════

# Hibernate SQL Logging
# DEBUG level logs all generated SQL statements
#
# CRITICAL for learning Hibernate:
# - See exactly what SQL is generated
# - Observe when SQL is executed (at transaction end, not at method call)
# - Understand query parameters
#
# EXAMPLE LOG OUTPUT:
# [DEBUG org.hibernate.SQL] insert into books (isbn, price, published_year, title) values (?, ?, ?, ?)
#
# Alternative levels:
# - ERROR: Only errors
# - WARN: Warnings + errors
# - INFO: General info (less SQL detail)
# - DEBUG: All SQL statements (RECOMMENDED for learning)
# - TRACE: Even more detail (rarely needed)
logging.level.org.hibernate.SQL=DEBUG

# Hibernate Bind Parameter Logging
# TRACE level logs the actual parameter values bound to queries
# Shows WHAT DATA was sent to database
#
# EXAMPLE OUTPUT:
# [TRACE org.hibernate.orm.jdbc.bind] binding parameter [1] as [VARCHAR] - [978-0134685991]
# [TRACE org.hibernate.orm.jdbc.bind] binding parameter [2] as [NUMERIC] - [45.99]
# [TRACE org.hibernate.orm.jdbc.bind] binding parameter [3] as [INTEGER] - [2018]
# [TRACE org.hibernate.orm.jdbc.bind] binding parameter [4] as [VARCHAR] - [Effective Java]
#
# WITHOUT this:
# SQL: insert into books (isbn, price, published_year, title) values (?, ?, ?, ?)
# Data binding: HIDDEN (don't know what values were used)
#
# WITH this:
# SQL + data binding shown together (complete picture)
#
# LEARNING VALUE:
# Understand parameter binding (prevents SQL injection)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Application Logging
# DEBUG level logs custom code execution
# Useful for tracing service/controller calls in this application
#
# EXAMPLE:
# [DEBUG org.example.bookstore.service.BookService] Creating book: title=...
# [DEBUG org.example.bookstore.controller.BookController] Received POST request
logging.level.org.example.bookstore=DEBUG


